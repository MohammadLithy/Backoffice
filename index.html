<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backoffice Work</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        :root {
            --primary-color: #3b82f6; /* Electric Blue */
            --primary-hover: #60a5fa;
            --aura-glow: #06b6d4; /* Cyan Accent */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 50%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.45); /* Translucent Glass */
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-text: #fca5a5;
            --error-border: rgba(239, 68, 68, 0.3);
            --info-bg: rgba(6, 182, 212, 0.1);
            --info-text: #e0f2fe;
            --info-border: rgba(6, 182, 212, 0.3);
            --template-bg: rgba(15, 23, 42, 0.6);
            --portal-notice-bg: rgba(234, 179, 8, 0.15);
            --portal-notice-text: #fef08a;
            --portal-notice-border: rgba(234, 179, 8, 0.4);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text-main); 
            display: flex;
            flex-direction: column;
        }

        .fullscreen-container { 
            flex: 1;
            width: 100%;
            padding: 40px; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .header-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
        }

        .brand-title-group {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .samsung-badge {
            background-color: #ffffff;
            color: #000000;
            font-family: "Segoe UI", Black, sans-serif;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 3px;
            padding: 10px 20px;
            border-radius: 6px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        h2 { 
            margin: 0; 
            color: var(--text-main); 
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle { 
            color: var(--text-muted); 
            font-size: 14px;
            margin: 4px 0 0 0;
        }

        .control-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .selectors-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .dropdown-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 280px;
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        .control-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--aura-glow);
        }

        select, .panel-input {
            padding: 14px 16px;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            font-size: 16px;
            color: var(--text-main);
            background-color: rgba(15, 23, 42, 0.6);
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, .panel-input:focus {
            background-color: rgba(15, 23, 42, 0.8);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        select option {
            background-color: #0f172a;
            color: var(--text-main);
        }

        .search-row {
            display: flex;
            gap: 16px;
        }

        .search-row input { 
            flex: 1;
            padding: 16px 20px; 
            box-sizing: border-box; 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            font-size: 16px; 
            transition: all 0.3s ease;
            outline: none;
            color: var(--text-main);
            background-color: rgba(15, 23, 42, 0.6);
        }

        .search-row input:focus {
            background-color: rgba(15, 23, 42, 0.8);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        button { 
            padding: 0 40px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #1d4ed8 100%);
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.3s ease;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        button:hover { 
            background: linear-gradient(135deg, var(--primary-hover) 0%, #2563eb 100%);
            box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
            transform: translateY(-1px);
        }

        .results-workspace {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 24px;
            align-content: start;
        }

        .message-banner { 
            grid-column: 1 / -1;
            font-weight: 500; 
            padding: 18px 24px; 
            border-radius: 12px; 
            font-size: 16px;
            backdrop-filter: blur(4px);
        }

        .error {
            color: var(--error-text); 
            background: var(--error-bg); 
            border: 1px solid var(--error-border); 
        }

        .result-card { 
            padding: 26px; 
            border: 1px solid var(--card-border);
            background: var(--card-bg); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: start;
            position: relative;
            overflow: hidden;
        }

        .result-card h3 { 
            margin: 0; 
            color: #ffffff; 
            font-size: 21px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            letter-spacing: -0.3px;
        }

        .contact-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            font-size: 15px;
        }

        .contact-label {
            font-weight: 500;
            color: var(--text-muted);
        }

        .contact-value a {
            color: var(--primary-hover);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-value .missing {
            color: rgba(148, 163, 184, 0.4);
            font-style: italic;
        }

        .portal-notice-box {
            margin-top: 14px;
            padding: 16px;
            background-color: var(--portal-notice-bg);
            border: 1px solid var(--portal-notice-border);
            color: var(--portal-notice-text);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .template-box {
            margin-top: 20px;
            padding: 16px;
            background-color: var(--template-bg);
            border: 1px dashed rgba(6, 182, 212, 0.3);
            border-radius: 10px;
            font-size: 14px;
        }

        .template-header {
            font-size: 12px;
            font-weight: bold;
            color: var(--aura-glow);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .template-field {
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }

        .field-label {
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 5px;
        }

        .field-body-text {
            display: block;
            margin-top: 6px;
            color: #e2e8f0;
            white-space: pre-line;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 6px;
        }
        
        .live-status-indicator {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="fullscreen-container">
    <div class="header-section">
        <div class="brand-title-group">
            <div class="samsung-badge">Samsung</div>
            <div>
                <h2>Backoffice Work</h2>
                <p class="subtitle">Search live routing channels, operations management, and parcel systems.</p>
            </div>
        </div>
    </div>
    
    <div class="control-panel">
        <div class="selectors-row">
            <div class="dropdown-group">
                <label class="control-label" for="issue-select">Select Issue Context</label>
                <select id="issue-select" onchange="runUIContextSwitch(this.value)">
                    <option value="bopis">BOPIS (Buy Online, Pick Up In Store)</option>
                    <option value="courier">Courier Routing</option>
                    <option value="warehouse">Warehouse Operations</option>
                </select>
            </div>

            <div class="dropdown-group" id="product-dropdown-wrapper">
                <label class="control-label" for="product-search-input">Search Product 1 (Type Model Name or Code)</label>
                <input type="text" id="product-search-input" class="panel-input" value="" autocomplete="off" placeholder="Type model code or name (e.g., SM-S948B, Vision AI)..." py-input="handle_live_product_match">
                <div id="live-match-status" class="live-status-indicator">⏳ Connecting to Google Sheets... Please wait.</div>
            </div>

            <div class="dropdown-group hidden" id="courier-dropdown-wrapper">
                <label class="control-label" for="courier-select">Select Logistics Provider</label>
                <select id="courier-select" py-change="execute_search">
                    <option value="all">-- All Couriers --</option>
                    <option value="BRING Logistics">BRING</option>
                    <option value="DHL Logistics">DHL</option>
                    <option value="Postnord Distribution">PostNord</option>
                    <option value="Posti Group">Posti</option>
                    <option value="Skanlog Supply Chain">Skanlog</option>
                </select>
            </div>

            <div class="dropdown-group hidden" id="warehouse-dropdown-wrapper">
                <label class="control-label" for="warehouse-select">Select Target Warehouse</label>
                <select id="warehouse-select" py-change="execute_warehouse_render">
                    <option value="">-- Choose Warehouse --</option>
                    <option value="WC61_SCHENKER">WC 61 - DB Schenker</option>
                    <option value="WC41_KUEHNE">WC 41 - Kuehne Nagel</option>
                    <option value="WC21_KUEHNE">WC 21 - Kuehne Nagel</option>
                </select>
            </div>
        </div>

        <div class="search-row" id="action-search-row">
            <input type="text" id="store-input" placeholder="Type store name to search (e.g. Vinterbro, Porvoo)..." py-input="handle_store_live_type">
            <button id="search-btn" py-click="execute_search">Search Data Channel</button>
        </div>
    </div>

    <div id="output" class="results-workspace"></div>
</div>

<template id="courier-card-blueprint">

            </div>
            <div class="template-field">
                <span class="field-label">Body Blueprint:</span>
                <span class="field-body-text courier-body-lbl"></span>
            </div>
        </div>
    </div>
</template>

<script>
function runUIContextSwitch(val) {
    var pWrap = document.getElementById("product-dropdown-wrapper");
    var cWrap = document.getElementById("courier-dropdown-wrapper");
    var wWrap = document.getElementById("warehouse-dropdown-wrapper");
    var sRow = document.getElementById("action-search-row");
    var outputDiv = document.getElementById("output");
    
    outputDiv.innerHTML = "";
    pWrap.classList.add("hidden");
    cWrap.classList.add("hidden");
    wWrap.classList.add("hidden");
    sRow.classList.add("hidden");
    
    if (val === "courier") {
        cWrap.classList.remove("hidden");
    } else if (val === "warehouse") {
        wWrap.classList.remove("hidden");
        document.getElementById("warehouse-select").value = "";
    } else {
        pWrap.classList.remove("hidden");
        sRow.classList.remove("hidden");
    }

    if (window.pyscript && typeof window.pyscript.interpreter !== 'undefined') {
        document.getElementById("search-btn").click();
    }
}
</script>

def on_start():
    global LIVE_PRODUCT_LIST
    status_label = document.getElementById("live-match-status")
    search_input = document.getElementById("product-search-input")
    search_input.value = ""
    try:
        response_stream = open_url(SHEET_CSV_URL)
        csv_reader = csv.reader(response_stream.read().splitlines())
        next(csv_reader, None)
        
        LIVE_PRODUCT_LIST = list(HARDCODED_PRODUCTS)
        for row in csv_reader:
            if len(row) >= 2:
                LIVE_PRODUCT_LIST.append({"name": row[0].strip(), "model": row[1].strip()})
        status_label.innerHTML = "🟢 Connected to Sheet! Local definitions and updates are active."
    except Exception as e:
        LIVE_PRODUCT_LIST = list(HARDCODED_PRODUCTS)
        status_label.innerHTML = "ℹ️ Running on local internal index database."

on_start()

def handle_live_product_match(event):
    global CURRENT_PRODUCT_NAME, CURRENT_PRODUCT_CODE
    user_typed = document.getElementById("product-search-input").value.strip().lower()
    status_label = document.getElementById("live-match-status")
    
    if not user_typed:
        CURRENT_PRODUCT_NAME = ""
        CURRENT_PRODUCT_CODE = ""
        status_label.innerHTML = "Template output: Product 1 will show empty until you search"
    else:
        matched_item = None
        for item in LIVE_PRODUCT_LIST:
            if user_typed in item["name"].lower() or user_typed in item["model"].lower():
                matched_item = item
                break
        if matched_item:
            CURRENT_PRODUCT_NAME = matched_item["name"]
            CURRENT_PRODUCT_CODE = matched_item["model"]
            status_label.innerHTML = f"🎯 Matched: <strong>{CURRENT_PRODUCT_CODE}</strong> ({CURRENT_PRODUCT_NAME})"
        else:
            CURRENT_PRODUCT_NAME = ""
            CURRENT_PRODUCT_CODE = ""
            status_label.innerHTML = "🔍 Searching index profiles..."

    store_query = document.getElementById("store-input").value.strip()
    if store_query:
        render_bopis_results()

def execute_warehouse_render(event):
    output_div = document.getElementById("output")
    selected_wh_key = document.getElementById("warehouse-select").value
    if not selected_wh_key:
        output_div.innerHTML = ""
        return
    wh_data = WAREHOUSE_DATABASE[selected_wh_key]
    
    tmpl = document.getElementById("warehouse-card-blueprint").content.cloneNode(True)
    tmpl.getElementById("wh-title-placeholder").innerHTML = f"🏭 {wh_data['title']}"
    
    eLink = tmpl.getElementById("wh-email-link")
    eLink.href = f"mailto:{wh_data['email']}"
    eLink.innerHTML = wh_data['email']
    
    cLink = tmpl.getElementById("wh-cc-link")
    cLink.href = f"mailto:{wh_data['cc']}"

    tmpl.getElementById("lbl-to").innerHTML = wh_data['email']

    output_div.innerHTML = ""
    output_div.appendChild(tmpl)

def render_bopis_results():
    output_div = document.getElementById("output")
    search_query = document.getElementById("store-input").value.strip().lower()
    if not search_query:
        output_div.innerHTML = ""
        return
    
    product_1_line = f"Product 1: {CURRENT_PRODUCT_CODE} / {CURRENT_PRODUCT_NAME}" if CURRENT_PRODUCT_NAME else "Product 1: "
    container = document.createDocumentFragment()
    match_found = False
    
    for store_name, data in BOPIS_DATABASE.items():
        if search_query in store_name.lower():
            match_found = True
            ops_email = data["ops"]
            mgr_email = data["mgr"]
            
            tmpl = document.getElementById("bopis-card-blueprint").content.cloneNode(True)
            tmpl.querySelector(".bopis-title").innerHTML = f"🏬 {store_name}"
            
            ops_val = tmpl.querySelector(".bopis-ops-val")
            if ops_email:
                ops_val.innerHTML = f'<a href="mailto:{ops_email}">{ops_email}</a>'
            else:
                ops_val.innerHTML = '<span class="missing">Not Listed</span>'
                
            mgr_val = tmpl.querySelector(".bopis-mgr-val")
            if mgr_email:
                mgr_val.innerHTML = f'<a href="mailto:{mgr_email}">{mgr_email}</a>'
            else:
                mgr_val.innerHTML = '<span class="missing">Not Listed</span>'
                
            tmpl.querySelector(".bopis-to-lbl").innerHTML = f"{ops_email or ''}; {mgr_email or ''}"
            tmpl.querySelector(".bopis-subj-lbl").innerHTML = f"BOPIS Issue - {store_name}"
            
            body_text = f"Hi,\nDescribe the issue\n{product_1_line}\nElkjöp SO number: 20xxxxx\nSamsung PO number: SE250608-xxxxxx\nBP: 25xxxxx\nStore: {store_name}"
            tmpl.querySelector(".bopis-body-lbl").innerHTML = body_text
            
            container.appendChild(tmpl)
            
    output_div.innerHTML = ""
    if not match_found:
        output_div.innerHTML = f'<div class="message-banner error">🔍 No BOPIS configurations active matching "{search_query}".</div>'
    else:
        output_div.appendChild(container)

def execute_search(event):
    selected_issue = document.getElementById("issue-select").value
    output_div = document.getElementById("output")
    if selected_issue == "courier":
        selected_courier = document.getElementById("courier-select").value
        container = document.createDocumentFragment()
        
        for courier_name, data in COURIER_DATABASE.items():
            if (selected_courier == "all") or (selected_courier == courier_name):
                tmpl = document.getElementById("courier-card-blueprint").content.cloneNode(True)
                tmpl.querySelector(".courier-title").innerHTML = f"🚚 {courier_name}"
                
                # If Bring or Postnord, remove the address block fields to only feature the portal query message
                if courier_name in ["BRING Logistics", "Postnord Distribution"]:
                    contacts_div = tmpl.getElementById("courier-contacts-container")
                    if contacts_div:
                        contacts_div.remove()
                    notice_el = tmpl.querySelector(".courier-portal-notice")
                    notice_el.classList.remove("hidden")
                else:
                    ops_val = tmpl.querySelector(".courier-ops-val")
                    if data["ops"]:
                        ops_val.innerHTML = f'<a href="mailto:{data["ops"]}">{data["ops"]}</a>'
                    else:
                        ops_val.innerHTML = '<span class="missing">Not Listed</span>'
                        
                    mgr_val = tmpl.querySelector(".courier-mgr-val")
                    if data["mgr"]:
                        mgr_val.innerHTML = f'<a href="mailto:{data["mgr"]}">{data["mgr"]}</a>'
                    else:
                        mgr_val.innerHTML = '<span class="missing">Not Listed</span>'
                
                # Check for Skanlog to attach updated address, CC alignment, and metrics profile
                if courier_name == "Skanlog Supply Chain":
                    wrapper = tmpl.querySelector(".courier-template-wrapper")
                    wrapper.classList.remove("hidden")
                    tmpl.querySelector(".courier-to-lbl").innerHTML = f"{data['ops'] or ''}"
                    tmpl.querySelector(".courier-cc-lbl").innerHTML = "ct.ecommerce@samsung.com"
                    tmpl.querySelector(".courier-subj-lbl").innerHTML = "Skanlog Delivery Incident Routing"
                    
                    skanlog_body = "Hello,\n\nDescribe the issue\n\nShipment: S461097570\nPO: \nLSP kolli: SAMS461097570\nDO: \nCity: \nPostal code: "
                    tmpl.querySelector(".courier-body-lbl").innerHTML = skanlog_body
                
                # Check for Posti to implement requested incident template and alignment constraints
                elif courier_name == "Posti Group":
                    wrapper = tmpl.querySelector(".courier-template-wrapper")
                    wrapper.classList.remove("hidden")
                    tmpl.querySelector(".courier-to-lbl").innerHTML = f"{data['ops'] or ''}"
                    tmpl.querySelector(".courier-cc-lbl").innerHTML = "ct.ecommerce@samsung.com"
                    tmpl.querySelector(".courier-subj-lbl").innerHTML = "Posti Delivery Incident Routing"
                    
                    posti_body = "Dear Posti,\n\nDescription:\nShipment:\nPO:\nLSP kolli:\n\nThank you!\n*Company signature.*"
                    tmpl.querySelector(".courier-body-lbl").innerHTML = posti_body

                # Check for DHL to attach requested target parameters, layout and explicit CC exclusion
                elif courier_name == "DHL Logistics":
                    wrapper = tmpl.querySelector(".courier-template-wrapper")
                    wrapper.classList.remove("hidden")
                    tmpl.querySelector(".courier-to-lbl").innerHTML = f"{data['ops'] or ''}"
                    tmpl.querySelector(".courier-cc-lbl").innerHTML = '<span class="missing">Excluded</span>'
                    tmpl.querySelector(".courier-subj-lbl").innerHTML = "DHL Delivery Incident Routing"
                    
                    dhl_body = "Descriptions:\nWaybill:\nDO:\n\nThank you!"
                    tmpl.querySelector(".courier-body-lbl").innerHTML = dhl_body
                    
                container.appendChild(tmpl)
                
        output_div.innerHTML = ""
        output_div.appendChild(container)
    elif selected_issue == "warehouse":
        execute_warehouse_render(None)
    else:
        search_query = document.getElementById("store-input").value.strip()
        if not search_query:
            output_div.innerHTML = ""
            return
        render_bopis_results()
